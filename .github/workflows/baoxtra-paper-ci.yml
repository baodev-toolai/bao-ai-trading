name: BaoXTra Paper CI

on:
  push:
    branches: [main, 'work200/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work200-python:
    name: Work200 paper-only Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: work200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile Python
        run: python -m compileall -q crypto_bot
      - name: Test isolated SPOT paper core
        run: python -m pytest -q tests

  node-syntax:
    name: Existing Node.js syntax (no server startup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check only
        run: |
          node --check server.js
          node --check core/decision-engine.js
          node --check core/signal-analyzer.js
          node --check core/signal-normalizer.js
          node --check config/instruments.js
