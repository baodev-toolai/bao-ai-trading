name: BaoXTra Required CI
# Always runs on every pull request to main. Do not add a paths filter.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baoxtra-required-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baoxtra-required:
    name: baoxtra-required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Work200 paper test dependencies
        working-directory: work200
        run: python -m pip install -e '.[test]'

      - name: Compile Work200 paper core
        working-directory: work200
        run: python -m compileall -q crypto_bot

      - name: Test Work200 isolated paper core
        working-directory: work200
        run: python -m pytest -q tests

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check existing Node.js source syntax without running server
        run: |
          node --check server.js
          node --check core/decision-engine.js
          node --check core/signal-analyzer.js
          node --check core/signal-normalizer.js
          node --check config/instruments.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

# This CI does not run any live broker connector or execute any trades.
# It verifies static build/tests only; not Sandbox E2E, MT5 F7, or browser QA.
