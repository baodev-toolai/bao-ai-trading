name: BaoXTra V3.1 Frontend CI (read-only)
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/baoxtra-frontend-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
